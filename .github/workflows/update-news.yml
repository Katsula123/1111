
name: Update Taiwan Auto Daily News

on:
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "scripts/fetch_news.py"
      - "requirements.txt"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

concurrency:
  group: update-auto-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch and organize news
        run: python scripts/fetch_news.py

      - name: Commit updated news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No news data changes to commit."
          else
            git commit -m "chore: update automotive news data"
            git push
          fi
